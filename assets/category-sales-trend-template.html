<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Amazon 类目近24个月销量趋势</title>
  <style>
    :root{--page:#3a147b;--panel-a:#9f78bf;--panel-b:#df5d9c;--panel-c:#c874b9;--text:#fff;--ink:#1a1230;--blue:#1595f9;--blue-dark:#1727a2;--yellow:#f4fb20;--hot:#ff5db2;--high:#ff7a1a;--review:#7a00a8}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Microsoft YaHei",Arial,sans-serif;color:var(--text);background:radial-gradient(circle at 10% 10%,rgba(255,120,220,.35),transparent 28%),linear-gradient(135deg,#40208b 0%,#801d8e 43%,#e22075 100%)}.dashboard{width:min(1360px,100vw);margin:0 auto;padding:8px}.top-grid{display:grid;grid-template-columns:1.45fr 1.72fr .66fr .66fr .66fr .66fr;gap:10px;align-items:stretch}.tile{border:1.5px solid #13071e;border-radius:13px;background:linear-gradient(145deg,rgba(183,126,193,.94),rgba(224,91,157,.93));box-shadow:0 2px 0 rgba(0,0,0,.22);overflow:hidden}.title-card{min-height:98px;display:flex;align-items:center;padding:0 24px;background:rgba(183,126,193,.95)}.title-card h1{margin:0;font-size:28px;line-height:1.2;color:#16121e;letter-spacing:0;font-weight:800}.metadata-card{min-height:98px;display:grid;grid-template-columns:1fr 1fr;gap:1px;padding:9px 16px;background:linear-gradient(145deg,rgba(183,126,193,.94),rgba(224,91,157,.93))}.meta-cell{display:grid;align-content:center;gap:4px;border:2px solid rgba(255,255,255,.3);background:#704fc5;padding:8px 10px;overflow:hidden}.meta-label{font-size:11px;opacity:.84}.meta-value{font-size:12px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.kpi{min-height:98px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:#df5d9c}.kpi .value{font-size:27px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums}.kpi .label{margin-top:10px;font-size:13px}.kpi .value.positive{color:#fff1a8}.kpi .value.negative{color:#2a1050}.kpi .value.neutral{color:#fff}.category-panel,.trend-panel,.table-panel{margin-top:14px}.panel{min-height:286px;padding:12px 16px 14px;background:rgba(183,126,193,.86);border:1.5px solid #13071e;border-radius:13px;box-shadow:0 2px 0 rgba(0,0,0,.24)}.panel.pink{background:rgba(220,96,158,.88)}.panel h2{margin:0 0 10px;text-align:center;font-size:20px;line-height:1.28;color:#fff}.category-panel{min-height:152px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.category-field{min-width:0;padding:8px 10px;border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.10);border-radius:8px}.category-label{font-size:12px;opacity:.86}.category-value{margin-top:5px;font-size:13px;line-height:1.42;font-weight:800;word-break:break-word}.category-value.path{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}.trend-panel{min-height:330px}.visual-grid{display:block}.line-chart{height:250px;position:relative;padding:10px 4px 22px}.line-chart svg{width:100%;height:100%;overflow:visible}.grid-line{stroke:rgba(255,255,255,.6);stroke-dasharray:1 5}.axis-label{fill:#fff;font-size:10px;font-weight:700}.line-prev{fill:none;stroke:var(--blue);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.line-recent{fill:none;stroke:var(--yellow);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.point-prev{fill:var(--blue)}.point-recent{fill:var(--yellow)}.boundary{stroke:rgba(255,255,255,.86);stroke-width:1;stroke-dasharray:5 5}.legend{display:flex;justify-content:center;gap:18px;font-size:12px;font-weight:800}.legend span{display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:-1px}.legend .prev{background:var(--blue)}.legend .recent{background:var(--yellow)}.lower-grid{margin-top:14px;display:grid;grid-template-columns:1.55fr .95fr;gap:14px}.comparison-panel,.insights-panel{min-height:286px}.bar-chart{display:grid;gap:18px;padding:20px 4px 0}.bar-row{display:grid;grid-template-columns:120px 1fr 86px;gap:10px;align-items:center;font-size:13px;font-weight:800}.bar-track{height:30px;background:rgba(255,255,255,.12);border-left:1px dotted rgba(255,255,255,.7);border-right:1px dotted rgba(255,255,255,.45)}.bar-fill{height:100%}.bar-fill.prev{background:var(--blue)}.bar-fill.recent{background:var(--yellow)}.bar-num{text-align:right;font-variant-numeric:tabular-nums}.comparison-delta{margin-top:22px;text-align:center;font-size:15px;font-weight:900}.comparison-delta.positive{color:#fff1a8}.comparison-delta.negative{color:#2a1050}.comparison-delta.neutral{color:#fff}.reason-list{display:grid;gap:10px;padding:8px 2px 0}.reason-row{display:grid;grid-template-columns:1fr;gap:4px;padding:10px;border:1px solid rgba(255,255,255,.24);border-radius:8px;background:rgba(255,255,255,.10);font-size:12px;font-weight:700}.reason-title{color:#fff1a8}.reason-text{line-height:1.5}.table-panel{min-height:300px;padding-bottom:10px}.table-wrap{max-height:390px;overflow:auto;border-radius:8px;border:1px solid rgba(0,0,0,.35)}table{width:100%;border-collapse:collapse;table-layout:fixed;background:rgba(255,255,255,.06)}th,td{padding:8px 9px;border-bottom:1px solid rgba(255,255,255,.24);font-size:12px;vertical-align:top}th{position:sticky;top:0;z-index:1;background:rgba(83,39,139,.95);text-align:left}tr:hover{background:rgba(255,255,255,.16)}.num{text-align:right;font-variant-numeric:tabular-nums}.period-prev{color:#ccecff;font-weight:800}.period-recent{color:#fff1a8;font-weight:800}.missing{color:#fff1a8;font-weight:800}.empty-note{padding:30px 14px;text-align:center;font-size:15px;font-weight:800}@media(max-width:980px){.top-grid,.lower-grid{grid-template-columns:1fr;margin-top:12px}.metadata-card{grid-template-columns:1fr 1fr}.category-panel{grid-template-columns:1fr}.title-card h1{font-size:28px}.bar-row{grid-template-columns:105px 1fr 74px}.table-wrap{max-height:440px}}
  </style>
</head>
<body>
  <main class="dashboard">
    <section class="top-grid">
      <div class="tile title-card"><h1>跨境吴老师｜Amazon 类目近24个月销量趋势</h1></div>
      <div class="tile metadata-card">
        <div class="meta-cell"><div class="meta-label">站点</div><div class="meta-value" id="marketplace"></div></div>
        <div class="meta-cell"><div class="meta-label">目标截止月份</div><div class="meta-value" id="cutoffMonth"></div></div>
        <div class="meta-cell"><div class="meta-label">数据来源</div><div class="meta-value">卖家精灵 MCP</div></div>
        <div class="meta-cell"><div class="meta-label">数据口径</div><div class="meta-value" id="scopeLabel"></div></div>
      </div>
      <div class="tile kpi"><div class="value" id="previousValue"></div><div class="label" id="previousLabel"></div></div>
      <div class="tile kpi"><div class="value" id="recentValue"></div><div class="label" id="recentLabel"></div></div>
      <div class="tile kpi"><div class="value" id="deltaValue"></div><div class="label" id="deltaLabel"></div></div>
      <div class="tile kpi"><div class="value" id="rateValue"></div><div class="label" id="rateLabel"></div></div>
    </section>
    <section class="panel category-panel">
      <div class="category-field"><div class="category-label">英文类目路径</div><div class="category-value path" id="englishPath"></div></div>
      <div class="category-field"><div class="category-label">本地语言类目路径</div><div class="category-value path" id="localPath"></div></div>
      <div class="category-field"><div class="category-label">nodeIdPath</div><div class="category-value" id="nodeIdPath"></div></div>
      <div class="category-field"><div class="category-label">类目确认状态</div><div class="category-value" id="leafStatus"></div></div>
    </section>
    <section class="panel pink trend-panel"><h2>24个月月销量趋势</h2><div class="legend"><div><span class="prev"></span>前12个月</div><div><span class="recent"></span>近12个月</div></div><div class="line-chart" id="trendChart"></div></section>
    <section class="lower-grid">
      <section class="panel comparison-panel"><h2>两个12个月周期销量对比</h2><div class="bar-chart" id="comparisonChart"></div><div class="comparison-delta" id="comparisonDelta"></div></section>
      <section class="panel pink insights-panel"><h2>关键洞察</h2><div class="reason-list" id="insights"></div></section>
    </section>
    <section class="panel pink table-panel"><h2>月度数据明细</h2><div class="table-wrap"><table><thead><tr><th>月份</th><th>周期</th><th class="num">销量</th><th class="num">平均单品销量</th><th class="num">平均销售额</th><th class="num">平均价格</th><th class="num">商品数</th></tr></thead><tbody id="monthlyTable"></tbody></table></div></section>
  </main>
  <script id="dashboard-data" type="application/json">__DASHBOARD_DATA_JSON__</script>
  <script>
    const D=JSON.parse(document.getElementById('dashboard-data').textContent),$=id=>document.getElementById(id),esc=v=>String(v??'—').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    const num=v=>typeof v==='number'&&Number.isFinite(v),n=v=>num(v)?v.toLocaleString('en-US',{maximumFractionDigits:0}):'—',money=v=>num(v)?`${D.currencyCode||''} ${v.toLocaleString('en-US',{maximumFractionDigits:2})}`.trim():'—',cls=v=>v>0?'positive':v<0?'negative':'neutral';
    function text(id,v,title){const el=$(id);el.textContent=v??'—';if(title)el.title=v??''}function kpi(valueId,labelId,item){text(labelId,item?.label||'—');const el=$(valueId),v=item?.value;el.textContent=item?.display??(num(v)?`${v>0&&item?.signed?'+':''}${n(v)}`:'—');el.className='value '+(num(v)?cls(v):'neutral')}
    function drawTrend(rows){const known=rows.filter(r=>num(r.totalUnits));if(!known.length){$('trendChart').innerHTML='<div class="empty-note">没有可确认的月度销量数据</div>';return}const W=1040,H=250,L=52,R=18,T=12,B=48,vals=known.map(r=>r.totalUnits),ceil=Math.max(1,Math.ceil(Math.max(...vals)/1000)*1000),px=i=>L+i*(W-L-R)/23,py=v=>T+(ceil-v)*(H-T-B)/ceil;let grid='',labels='',dots='',prev='',recent='',lastPrev=false,lastRecent=false;for(let i=0;i<=4;i++){const y=T+i*(H-T-B)/4;grid+=`<line class="grid-line" x1="${L}" y1="${y}" x2="${W-R}" y2="${y}"/><text class="axis-label" x="2" y="${y+4}">${n(Math.round(ceil*(4-i)/4))}</text>`}rows.forEach((r,i)=>{const x=px(i);labels+=`<text class="axis-label" transform="translate(${x-1},${H-16}) rotate(-45)">${esc(r.month)}</text>`;if(!num(r.totalUnits)){if(i<12)lastPrev=false;else lastRecent=false;return}const y=py(r.totalUnits),isPrev=i<12;if(isPrev){prev+=(lastPrev?' L ':'M ')+`${x} ${y}`;lastPrev=true}else{recent+=(lastRecent?' L ':'M ')+`${x} ${y}`;lastRecent=true}dots+=`<circle class="${isPrev?'point-prev':'point-recent'}" cx="${x}" cy="${y}" r="3.5"><title>${esc(r.month)}：${n(r.totalUnits)}</title></circle>`});const bound=(px(11)+px(12))/2;$('trendChart').innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${grid}<line class="boundary" x1="${bound}" y1="${T}" x2="${bound}" y2="${H-B}"/><path class="line-prev" d="${prev}"/><path class="line-recent" d="${recent}"/>${dots}${labels}</svg>`}
    function drawComparison(k){const a=k?.previous?.value,b=k?.recent?.value;if(!num(a)&&!num(b)){$('comparisonChart').innerHTML='<div class="empty-note">数据不完整，无法比较周期销量</div>';$('comparisonDelta').textContent='—';return}const m=Math.max(1,num(a)?a:0,num(b)?b:0),row=(label,v,type)=>`<div class="bar-row"><div>${esc(label)}</div><div class="bar-track"><div class="bar-fill ${type}" style="width:${num(v)?v/m*100:0}%"></div></div><div class="bar-num">${n(v)}</div></div>`;$('comparisonChart').innerHTML=row(k.previous.label,a,'prev')+row(k.recent.label,b,'recent');const delta=k.delta||{},rate=k.changeRate||{},el=$('comparisonDelta');if(num(delta.value)&&num(rate.value)){el.className='comparison-delta '+cls(delta.value);el.textContent=`变化量：${delta.value>0?'+':''}${n(delta.value)}　｜　变化比例：${rate.display||'—'}`}else{el.className='comparison-delta neutral';el.textContent='周期覆盖不完整，不计算变化量与增长率'}}
    function render(){const c=D.category||{},coverage=D.coverage||{},k=D.kpis||{};text('marketplace',D.marketplace);text('cutoffMonth',D.targetCutoffMonth);text('scopeLabel',D.scopeLabel);text('englishPath',c.englishPath,c.englishPath);text('localPath',c.localPath,c.localPath);text('nodeIdPath',c.nodeIdPath);text('leafStatus',c.leafStatus);kpi('previousValue','previousLabel',k.previous);kpi('recentValue','recentLabel',k.recent);kpi('deltaValue','deltaLabel',k.delta);kpi('rateValue','rateLabel',k.changeRate);drawTrend(D.monthly||[]);drawComparison(k);const I=D.insights||{},partial=D.status==='partial',blocked=D.status==='blocked',ins=blocked?[['数据状态',D.blockReason||'无法完成分析']]:partial?[['数据覆盖',`${coverage.availableMonths??0}/${coverage.expectedMonths??24} 个月已确认`],['峰值月份',I.peak||'—'],['最近表现',I.recent||'—']]:[['整体变化',I.overall||'—'],['峰值月份',I.peak||'—'],['最近表现',I.recent||'—']];$('insights').innerHTML=ins.map(x=>`<div class="reason-row"><div class="reason-title">${x[0]}</div><div class="reason-text">${esc(x[1])}</div></div>`).join('');$('monthlyTable').innerHTML=(D.monthly||[]).map(r=>{const missing=!num(r.totalUnits),periodClass=r.period==='近12个月'?'period-recent':'period-prev',units=missing?`<span class="missing" title="${esc(r.missingReason||r.dataStatus||'缺失')}">—（缺失）</span>`:n(r.totalUnits);return `<tr><td>${esc(r.month)}</td><td class="${periodClass}">${esc(r.period)}</td><td class="num">${units}</td><td class="num">${n(r.avgUnits)}</td><td class="num">${money(r.avgRevenue)}</td><td class="num">${money(r.avgPrice)}</td><td class="num">${n(r.totalProducts)}</td></tr>`}).join('')}
    render();
  </script>
</body>
</html>
